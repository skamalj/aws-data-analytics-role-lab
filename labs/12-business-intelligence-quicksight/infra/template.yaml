AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Cloud Quest Data Analytics - Lab 12 Business Intelligence with Amazon QuickSight.
  Starting environment: a year of sales in S3, cataloged in Glue (riverbend_bi), an
  Athena workgroup, and (after seeding) a reporting view v_sales.
  QuickSight itself must be subscribed to in the console (see the lab README).

Resources:
  LakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-lake-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-athena-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: expire, Status: Enabled, ExpirationInDays: 7 }

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Ref AWS::StackName
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        ResultConfiguration:
          OutputLocation: !Sub "s3://${AthenaResultsBucket}/results/"

  BiDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: riverbend_bi

  OrdersTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref BiDatabase
      TableInput:
        Name: orders
        TableType: EXTERNAL_TABLE
        Parameters: { classification: csv, skip.header.line.count: "1" }
        StorageDescriptor:
          Location: !Sub "s3://${LakeBucket}/orders/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters: { field.delim: "," }
          Columns:
            - { Name: order_id, Type: string }
            - { Name: order_ts, Type: timestamp }
            - { Name: customer_id, Type: string }
            - { Name: product_id, Type: string }
            - { Name: quantity, Type: int }
            - { Name: unit_price, Type: double }
            - { Name: discount, Type: double }
            - { Name: total_amount, Type: double }
            - { Name: channel, Type: string }
            - { Name: store_id, Type: string }
            - { Name: region, Type: string }
            - { Name: status, Type: string }

  CustomersTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref BiDatabase
      TableInput:
        Name: customers
        TableType: EXTERNAL_TABLE
        Parameters: { classification: csv, skip.header.line.count: "1" }
        StorageDescriptor:
          Location: !Sub "s3://${LakeBucket}/customers/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters: { field.delim: "," }
          Columns:
            - { Name: customer_id, Type: string }
            - { Name: first_name, Type: string }
            - { Name: last_name, Type: string }
            - { Name: email, Type: string }
            - { Name: phone, Type: string }
            - { Name: city, Type: string }
            - { Name: country, Type: string }
            - { Name: region, Type: string }
            - { Name: signup_date, Type: date }
            - { Name: loyalty_tier, Type: string }

  ProductsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref BiDatabase
      TableInput:
        Name: products
        TableType: EXTERNAL_TABLE
        Parameters: { classification: csv, skip.header.line.count: "1" }
        StorageDescriptor:
          Location: !Sub "s3://${LakeBucket}/products/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters: { field.delim: "," }
          Columns:
            - { Name: product_id, Type: string }
            - { Name: product_name, Type: string }
            - { Name: category, Type: string }
            - { Name: unit_price, Type: double }

Outputs:
  LakeBucket: { Value: !Ref LakeBucket }
  AthenaResultsBucket: { Value: !Ref AthenaResultsBucket }
  AthenaWorkGroup: { Value: !Ref AthenaWorkGroup }
  GlueDatabase: { Value: !Ref BiDatabase }
